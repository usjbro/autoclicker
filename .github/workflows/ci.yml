name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  LUNE_VERSION: 0.10.5
  ROJO_VERSION: 7.7.0
  LUAU_LSP_VERSION: 1.69.0

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Lune/Rojo/Luau LSP binaries
        id: tool-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/bin
          key: ${{ runner.os }}-lune-${{ env.LUNE_VERSION }}-rojo-${{ env.ROJO_VERSION }}-luau-lsp-${{ env.LUAU_LSP_VERSION }}

      - name: Install Lune
        if: steps.tool-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fL -o lune.zip "https://github.com/lune-org/lune/releases/download/v${LUNE_VERSION}/lune-${LUNE_VERSION}-linux-x86_64.zip"
          unzip lune.zip -d "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/lune"

      - name: Install Rojo
        if: steps.tool-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fL -o rojo.zip "https://github.com/rojo-rbx/rojo/releases/download/v${ROJO_VERSION}/rojo-${ROJO_VERSION}-linux-x86_64.zip"
          unzip rojo.zip -d "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/rojo"

      - name: Install Luau LSP
        if: steps.tool-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fL -o luau-lsp.zip "https://github.com/JohnnyMorganz/luau-lsp/releases/download/${LUAU_LSP_VERSION}/luau-lsp-linux-x86_64.zip"
          unzip luau-lsp.zip -d "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/luau-lsp"

      - name: Add tools to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run Lune test suites
        run: |
          lune run test/gameLogic.test.luau
          lune run test/mazeGeometry.test.luau
          lune run test/gameHandlers.test.luau
          lune run test/neonScript.test.luau

      - name: Verify Rojo project builds
        run: rojo build default.project.json -o /tmp/ci-build.rbxlx

      - name: Run Luau static analysis
        # Neither check above executes client/server Luau or type-checks it --
        # lune only runs the specific pure-logic files it requires, and rojo
        # build only compiles the place-file structure. This is what actually
        # catches invalid Enum references, argument mismatches, etc. before a
        # human has to open Studio and hit Play (see issue #43/PR #44, which
        # shipped a crash-on-load bug neither check above could have caught).
        #
        # Scoped to src/server, src/shared, src/client only -- real shipped
        # game code. src/tests/*.spec.lua and the vendored src/Packages/TestEZ
        # are deliberately excluded: TestEZ ships no Luau type definitions for
        # luau-lsp (Roblox Studio's own Script Analysis has proprietary TestEZ
        # support this open-source tool doesn't replicate), and the enforced
        # test surface is the separate Lune suite above, not the in-Studio
        # TestEZ suite -- so gating CI on a third-party package's own
        # strictness isn't worth the fragility.
        run: |
          rojo sourcemap default.project.json -o sourcemap.json
          curl -fL -o globalTypes.d.luau "https://raw.githubusercontent.com/JohnnyMorganz/luau-lsp/${LUAU_LSP_VERSION}/scripts/globalTypes.d.luau"
          luau-lsp analyze --platform roblox --sourcemap sourcemap.json --definitions globalTypes.d.luau src/server src/shared src/client

  # Tier 2 of the test-automation plan: submits test/structuralCheck.luau to
  # Roblox's Open Cloud Luau Execution API, which runs a real
  # MapBuilder.Build() inside the actual Roblox engine and asserts
  # structural properties (goal parts exist and are named correctly, no two
  # maze wings' actual built geometry overlaps, ReplicatedStorage has
  # exactly the declared RemoteEvents) that no other check in this file can
  # -- lune/rojo build/luau-lsp never execute a single line of this game's
  # actual server/client Luau, only its pure logic, place structure, and
  # types respectively.
  #
  # Important limitation: this runs against whatever is *currently
  # published* to the live place, not this PR's own uncommitted changes --
  # there's no publish-to-a-staging-place step wired up yet (that needs an
  # additional Open Cloud scope this repo doesn't have configured). So a
  # red result here means "production has drifted/broken," which may or
  # may not be caused by this specific PR. That's still real, valuable
  # signal (and the only thing in this repo that would ever catch it), just
  # not the same guarantee as "this PR's code is correct" -- which is why
  # this is its own job, not folded into test-and-build (the one check
  # branch protection currently requires), and not itself a required check
  # yet. Promote it once it's proven stable across real PRs and (ideally)
  # a build-and-publish step closes this gap.
  open-cloud-structural-check:
    runs-on: ubuntu-latest
    # Skipped for fork PRs: GitHub withholds repo secrets from
    # pull_request-triggered runs on forks by design, and this workflow
    # deliberately never uses pull_request_target (which would defeat that
    # protection on a public repo -- a malicious fork PR could modify the
    # workflow/script itself and exfiltrate ROBLOX_API_KEY). Skipping
    # explicitly, rather than letting the step fail on a missing secret,
    # avoids every external contributor's PR failing a check they have no
    # way to fix.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - name: Run Open Cloud structural check
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          ROBLOX_UNIVERSE_ID: ${{ vars.ROBLOX_UNIVERSE_ID }}
          ROBLOX_PLACE_ID: ${{ vars.ROBLOX_PLACE_ID }}
        run: ./test/openCloudStructuralCheck.sh
