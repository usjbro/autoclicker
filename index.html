<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Autoclicker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <h1>Autoclicker</h1>
    <p class="score">Score: <span id="score">0</span></p>
    <p class="rate">+<span id="rate">0</span>/sec</p>

    <button id="click-button">Click me!</button>

    <section class="shop">
      <h2>Shop</h2>
      <button id="buy-auto-clicker">
        Buy Auto-Clicker (+1/sec) — <span id="auto-clicker-cost">10</span> pts
      </button>
      <p>Auto-clickers owned: <span id="auto-clicker-count">0</span></p>
    </section>

    <button id="reset-button">Reset Progress</button>
  </main>

  <script src="script.js"></script>
</body>
</html>
